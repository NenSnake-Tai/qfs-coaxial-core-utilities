<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QFS Core - Utility Control Panel</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .bunker-panel {
            background: #050505;
            border: 2px solid #00ff66;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            padding: 20px;
            margin-top: 15px;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ff66;
        }
        .sub-tag {
            text-align: center;
            font-size: 0.8rem;
            color: #00aa44;
            margin-bottom: 25px;
        }
        .module-box {
            border: 1px dashed #00ff66;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 255, 102, 0.02);
        }
        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            color: #ffffff;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 5px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #00ff66;
        }
        input[type="text"] {
            width: 100%;
            background: #000;
            border: 1px solid #00ff66;
            color: #ffffff;
            padding: 10px;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            background: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.1);
            transition: all 0.3s;
        }
        button:hover {
            background: #00ff66;
            color: #000000;
            box-shadow: 0 0 15px #00ff66;
        }
        .terminal-output {
            background: #000000;
            border: 1px solid #005522;
            padding: 12px;
            min-height: 60px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: #00ff66;
        }
        .alert-triggered {
            color: #ff0033 !important;
            text-shadow: 0 0 5px #ff0033;
        }
    </style>
</head>
<body>

<div class="bunker-panel">
    <h1>⚡ QFS COAXIAL CORE UTILITIES ⚡</h1>
    <div class="sub-tag">RUNTIME ENGINE // ENVIRONMENT: ATLANTIC-BASALT</div>

    <!-- MÓDULO 1: GENERADOR SÍNCRONO DE HASHES -->
    <div class="module-box">
        <h2>🧱 INTEGRITY HASH GENERATOR</h2>
        <label>Insert payload data stream string:</label>
        <input type="text" id="hashInput" value="Directiva_Root_QFS_Alpha_Activada_Sin_Lag">
        <button onclick="ejecutarModuloHash()">Verify Stream Integrity</button>
        <div style="margin-top:12px;">Terminal Execution Stream:</div>
        <div class="terminal-output" id="hashOutput">[📡] System ready for payload ingest...</div>
    </div>

    <!-- MÓDULO 2: ANALIZADOR Y LIMPIADOR DEL BÚFER DE RED -->
    <div class="module-box">
        <h2>📡 NETWORK BUFFER ANALYZER & CLEANER</h2>
        <label>Simulated raw socket data payload (contains pararsite matrix lag):</label>
        <input type="text" id="bufferInput" value="DATA_STREAM_0XFA//\x00\x00_LAG_BURST_\\#pararsite_null_purgue">
        <button onclick="ejecutarModuloCleaner()">Purge Volatile Buffer</button>
        <div style="margin-top:12px;">Terminal Execution Stream:</div>
        <div class="terminal-output" id="bufferOutput">[📡] Network pipeline listening on virtual sockets...</div>
    </div>
</div>

<script>
    // ==========================================
    // LOGICA LOGICA CRIPTOGRÁFICA (MÓDULO 1)
    // ==========================================
    // @ts-ignore
    function calcularHashFNV(payload = "") {
        let hash = 0x811c9dc5;
        for (let i = 0; i < payload.length; i++) {
            hash ^= payload.charCodeAt(i);
            hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
        }
        return (hash >>> 0).toString(16).toUpperCase().padStart(8, '0');
    }

    function ejecutarModuloHash() {
        const inputStr = document.getElementById('hashInput').value;
        const outBox = document.getElementById('hashOutput');
        
        outBox.classList.remove('alert-triggered');
        const hashResult = calcularHashFNV(inputStr);
        
        let log = `[+] Ingesting text payload size: ${inputStr.length} bytes...\n`;
        log += `[🔒] Cryptographic Hash Generated: [ ${hashResult} ]\n`;
        
        if (inputStr.includes('Con_Lag') || inputStr.includes('malware')) {
            outBox.classList.add('alert-triggered');
            log += `[🚨] ALERT_CRITICAL_EXCEPTION: Integrity signature broken!\n`;
            log += `[🔒] ACTION: Memory line isolated to prevent buffer leak.`;
        } else {
            log += `[✅] CORE_INTEGRITY_VALIDATED: Data stream is secure and deterministic.`;
        }
        
        outBox.innerText = log;
    }

    // ==========================================
    // LOGICA LOGICA LIMPIADOR BÚFER DE RED (MÓDULO 2)
    // ==========================================
    function ejecutarModuloCleaner() {
        const rawPayload = document.getElementById('bufferInput').value;
        const outBox = document.getElementById('bufferOutput');
        
        let log = `[📥] Raw buffer packet captured from network thread...\n`;
        
        const regexPurga = /[\x00-\x1F\x7F-\x9F\\#]/g;
        const bufferLimpio = rawPayload.replace(regexPurga, '');
        
        log += `[🔬] Analyzing payload bytes for Matrix data lag...\n`;
        log += `[🧹] Executing core garbage inversion loop...\n`;
        log += `[✅] SUCCESS: Purgued stream: "${bufferLimpio}"\n`;
        log += `[🔒] Volatile buffer cleaned. Processing lag mitigated: 0.00ms.`;
        
        outBox.innerText = log;
    }
</script>

</body>
</html>
